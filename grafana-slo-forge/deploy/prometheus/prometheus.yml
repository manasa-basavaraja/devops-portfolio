global:
  scrape_interval: 15s
  evaluation_interval: 15s

# Pulls in everything that `python -m src.cli generate ... --out-dir out/`
# wrote into the project's ./out directory (mounted at /etc/prometheus/rules).
rule_files:
  - /etc/prometheus/rules/*.rules.yaml

scrape_configs:
  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]

  # Replace this with whatever services your SLO spec covers. Names must
  # line up with the `job=` selector your spec's SLI queries use.
  - job_name: checkout-api
    static_configs:
      - targets: ["host.docker.internal:8080"]
