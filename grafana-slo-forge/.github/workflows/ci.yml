name: ci

on:
  push:
    branches: [main, master]
    paths:
      - "grafana-slo-forge/**"
      - ".github/workflows/ci.yml"
  pull_request:
    paths:
      - "grafana-slo-forge/**"

defaults:
  run:
    working-directory: grafana-slo-forge

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: grafana-slo-forge/requirements.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest -q

  examples:
    name: validate + generate examples
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: grafana-slo-forge/requirements.txt
      - run: pip install -r requirements.txt
      - name: validate every example
        run: |
          for spec in examples/*.yaml; do
            python -m src.cli validate "$spec"
          done
      - name: generate artifacts
        run: |
          for spec in examples/*.yaml; do
            python -m src.cli generate "$spec" --out-dir out/
          done
      - name: lint generated prometheus rules
        run: |
          curl -fsSL -o promtool.tar.gz \
            https://github.com/prometheus/prometheus/releases/download/v2.54.1/prometheus-2.54.1.linux-amd64.tar.gz
          tar -xzf promtool.tar.gz
          ./prometheus-2.54.1.linux-amd64/promtool check rules out/*.rules.yaml
      - uses: actions/upload-artifact@v4
        with:
          name: slo-forge-out
          path: grafana-slo-forge/out/
          if-no-files-found: error
